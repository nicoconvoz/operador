# Parity and safety, on every push.
#
# The suite is the reason any of this can be trusted: indicator parity against
# TradingView's own exported values, the gates that refuse a rug, and the
# recovery path that halts rather than guessing. It runs before anything gets
# deployed anywhere.

name: tests

on:
  push:
    branches: [master, main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx vitest run

  # The dashboard, built the way Vercel builds it.
  #
  # A local `next build` resolves modules through the REPOSITORY's node_modules,
  # so a file under src/ importing a dev-only package (vitest, say) compiles
  # happily here and fails on Vercel, which installs only dashboard's own
  # dependencies. That exact mistake shipped a broken deploy once. This job
  # installs nothing but dashboard/package.json, so the two agree or this fails.
  dashboard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
