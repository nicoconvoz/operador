# The engine, on a schedule instead of a server.
#
# This is possible — and honest — only because of two properties the system
# already has: every adapter is HTTP polling (there is not a single WebSocket
# in the codebase) and every piece of state lives in Postgres. Nothing is held
# in memory between cycles, so there is nothing for a long-lived process to
# hold. A cycle run here is the same cycle a daemon would run.
#
# ── Why this runs a LONG job instead of many short ones ────────────────────
#
# It used to ask GitHub to fire every 15 minutes and run exactly one cycle.
# Measured over twelve hours, that produced THREE scheduled runs, 137 and 172
# minutes apart. Every short gap in the run list was a `workflow_dispatch` — a
# human pressing the button. GitHub's cron is best effort and it deprioritises
# high-frequency schedules; a */15 that lands hourly-or-worse is the normal
# case, not an outage.
#
# So the workflow stops depending on the trigger being punctual. One run now
# holds the loop open for hours and paces ITSELF at fifteen minutes. The cron
# only has to succeed once every ~5.5 hours, and the worst gap ever measured
# was 2h52m — an unreliable dependency turned into a reliable one by asking it
# for far less.
#
# Two limits worth knowing:
#
#   - A job is capped at 6 hours by GitHub. That is what bounds MAX_CYCLES.
#   - A scheduled workflow is DISABLED after 60 days with no commits to the
#     repository. Push something, or turn it back on.

name: engine

on:
  schedule:
    # Still every 15 minutes, but for a different reason: with the concurrency
    # group below, a fire that lands while a run is in progress becomes the
    # PENDING run, and GitHub starts it the moment the current one exits. So
    # the schedule is no longer a clock — it is a queue that keeps one run
    # always ready. Frequent firing means the gap between long runs is seconds.
    - cron: '*/15 * * * *'
  workflow_dispatch: # so you can run one by hand and watch the log

# A cycle writes to the database. Two at once would both try to open positions
# against the same capital, so a late run waits rather than overlapping.
#
# GitHub keeps at most ONE pending run per group — a newer arrival cancels the
# older pending one — so a frequent cron cannot pile up a backlog here.
concurrency:
  group: engine
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    # Ten minutes under GitHub's 6-hour ceiling, so the loop's own budget is
    # what ends the run and the cancel is never what ends a cycle mid-write.
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # The engine refuses to start on a bad configuration, so a broken secret
      # fails here rather than halfway through a ladder.
      - name: Run the engine
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPERADOR_CONTROL_TOKEN: ${{ secrets.OPERADOR_CONTROL_TOKEN }}
          OPERADOR_MODE: paper
          OPERADOR_CHAIN: solana,bsc
          OPERADOR_TIMEFRAME: 15m
          OPERADOR_CAPITAL_USD: ${{ vars.OPERADOR_CAPITAL_USD || '1000' }}
          OPERADOR_MAX_POSITIONS: ${{ vars.OPERADOR_MAX_POSITIONS || '5' }}
          OPERADOR_GAS_USD: ${{ vars.OPERADOR_GAS_USD || '0.05' }}
          # Tokens per chain given the expensive checks. Each costs ~9
          # throttled seconds on Solana and ~6 on BSC, so 20 keeps a two-chain
          # cycle near five minutes. The rest are shown as unchecked, and the
          # next cycle is now genuinely fifteen minutes away.
          OPERADOR_MAX_SECURITY_CHECKS: ${{ vars.OPERADOR_MAX_SECURITY_CHECKS || '20' }}
          # The pacing. A measured cycle spends ~12 minutes inside throttled
          # providers, so a 3-minute rest between cycles lands the next one on
          # roughly the next 15m bar. The loop sleeps AFTER the cycle, never
          # during it: cycles cannot overlap themselves.
          OPERADOR_CYCLE_MS: ${{ vars.OPERADOR_CYCLE_MS || '180000' }}
          # ~20 cycles x ~15 minutes = ~5 hours of engine per run.
          OPERADOR_MAX_CYCLES: ${{ vars.OPERADOR_MAX_CYCLES || '20' }}
        run: npm run cycle
