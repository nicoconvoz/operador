# The engine, on a schedule instead of a server.
#
# This is possible — and honest — only because of two properties the system
# already has: every adapter is HTTP polling (there is not a single WebSocket
# in the codebase) and every piece of state lives in Postgres. Nothing is held
# in memory between cycles, so there is nothing for a long-lived process to
# hold. A cycle run here is the same cycle a daemon would run.
#
# ── Why this runs a LONG job instead of many short ones ────────────────────
#
# It used to ask GitHub to fire every 15 minutes and run exactly one cycle.
# Measured over twelve hours, that produced THREE scheduled runs, 137 and 172
# minutes apart. Every short gap in the run list was a `workflow_dispatch` — a
# human pressing the button. GitHub's cron is best effort and it deprioritises
# high-frequency schedules; a */15 that lands hourly-or-worse is the normal
# case, not an outage.
#
# So the workflow stops depending on the trigger being punctual. One run now
# holds the loop open for hours and paces ITSELF at fifteen minutes. The cron
# only has to succeed once every ~5.5 hours, and the worst gap ever measured
# was 2h52m — an unreliable dependency turned into a reliable one by asking it
# for far less.
#
# Three limits worth knowing:
#
#   - A job is capped at 6 hours by GitHub. That is what bounds MAX_CYCLES.
#   - A scheduled workflow is DISABLED after 60 days with no commits to the
#     repository. Push something, or turn it back on.
#   - **A RUN PINS ITS COMMIT.** The checkout happens once, at the start, so a
#     run started at 18:23 keeps running that code until it exits — a fix
#     pushed at 18:30 does not reach production for another five hours. That is
#     the price of the long loop, and it is paid on every deploy. To ship
#     immediately: cancel the run and start a new one. Cancelling mid-cycle is
#     safe by construction — fills are persisted as they happen and recovery
#     reconciles anything that was in flight.

name: engine

on:
  schedule:
    # Still every 15 minutes, but for a different reason: with the concurrency
    # group below, a fire that lands while a run is in progress becomes the
    # PENDING run, and GitHub starts it the moment the current one exits. So
    # the schedule is no longer a clock — it is a queue that keeps one run
    # always ready. Frequent firing means the gap between long runs is seconds.
    - cron: '*/15 * * * *'
  workflow_dispatch: # so you can run one by hand and watch the log

# A cycle writes to the database. Two at once would both try to open positions
# against the same capital, so a late run waits rather than overlapping.
#
# GitHub keeps at most ONE pending run per group — a newer arrival cancels the
# older pending one — so a frequent cron cannot pile up a backlog here.
concurrency:
  group: engine
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    # Ten minutes under GitHub's 6-hour ceiling, so the loop's own budget is
    # what ends the run and the cancel is never what ends a cycle mid-write.
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      # The engine refuses to start on a bad configuration, so a broken secret
      # fails here rather than halfway through a ladder.
      - name: Run the engine
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OPERADOR_CONTROL_TOKEN: ${{ secrets.OPERADOR_CONTROL_TOKEN }}
          OPERADOR_MODE: paper
          # SOLANA ONLY, and it is a measurement rather than a preference.
          # One run, both chains, same commit:
          #
          #   solana  10.4 min   66 examined →  24 candidates   (36%)
          #   bsc     14.0 min  110 examined →   3 candidates   (2.7%)
          #
          # BSC cost more wall clock and returned eight times fewer names — and
          # every one of the 40 GoPlus rate-limit refusals in that run was its,
          # against zero on Solana. Half the scan for a tenth of the shortlist.
          #
          # A variable, not a deletion: the adapters, the sell probe through
          # PancakeSwap and the gates all still work, so putting it back is one
          # value in the repo settings the day BSC is worth the minutes.
          OPERADOR_CHAIN: ${{ vars.OPERADOR_CHAIN || 'solana' }}
          OPERADOR_TIMEFRAME: 15m
          OPERADOR_CAPITAL_USD: ${{ vars.OPERADOR_CAPITAL_USD || '1000' }}
          # ZERO means no ceiling: the capital decides, at one ladder's worth
          # each. With every slot the same size, what bounds the damage one
          # token can do is that size, not the count — and a count cap only
          # leaves capital idle. $1,500 at a $95 ladder is about fourteen.
          OPERADOR_MAX_POSITIONS: ${{ vars.OPERADOR_MAX_POSITIONS || '0' }}
          OPERADOR_GAS_USD: ${{ vars.OPERADOR_GAS_USD || '0.05' }}
          # Empty means UNBOUNDED: every token that cleared the free gates is
          # examined, every scan. Set the repository variable to a number only
          # to impose a cap on a day the providers are unhappy.
          OPERADOR_MAX_SECURITY_CHECKS: ${{ vars.OPERADOR_MAX_SECURITY_CHECKS }}
          # ── Every pass is a full scan ─────────────────────────────────
          #
          # The operator: *ahora el rescaneo hacelo a cada rato, si solo son 14
          # segundos.* A cold Solana scan is Jupiter and the chain in batches —
          # measured at 9.8 seconds — so there is nothing left for a slower
          # clock to save. The old split (watch 5 min, held 20, full 15 to 120)
          # was argued against a scan that cost four to twenty minutes of
          # somebody else's rate limit.
          #
          # What makes it affordable on the DATABASE, which is the free tier's
          # real limit: a scan keeps the candidates and the book and nothing
          # else. The security cache is BSC-only, the registry is read at most
          # every fifteen minutes and never written.
          #
          # The stop does not depend on this: it sweeps every 30 seconds inside
          # the sleep between passes.
          OPERADOR_CYCLE_MS: ${{ vars.OPERADOR_CYCLE_MS || '60000' }}
          OPERADOR_SCAN_MS: ${{ vars.OPERADOR_SCAN_MS || '60000' }}
          OPERADOR_HELD_SCAN_MS: ${{ vars.OPERADOR_HELD_SCAN_MS || '60000' }}
          # About eighty seconds a pass, so 240 passes ends a run near five
          # hours, inside the 350-minute job timeout rather than killed by it.
          OPERADOR_MAX_CYCLES: ${{ vars.OPERADOR_MAX_CYCLES || '240' }}
        run: npm run cycle
